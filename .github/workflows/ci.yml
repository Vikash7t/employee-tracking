name: CI / Enterprise Quality & Build Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: 1. Monorepo Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Contracts Package
        run: npm run build --workspace=@employee-tracking/contracts

      - name: Compile Backend (NestJS + Prisma)
        run: |
          npx prisma generate --schema=apps/backend/prisma/schema.prisma
          npm run build --workspace=@employee-tracking/backend

      - name: Compile Admin Portal (Next.js 15 Standalone)
        run: npm run build --workspace=@employee-tracking/admin

  test-and-verify:
    name: 2. Integration Tests & Spatial PostGIS Verification
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_test_password
          POSTGRES_DB: employee_tracking_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d employee_tracking_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres_ci_test_password@localhost:5432/employee_tracking_dev?schema=public"
      JWT_SECRET: "ci_pipeline_jwt_secret_must_be_over_32_characters_long"
      PORT: 4000
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Contracts
        run: npm run build --workspace=@employee-tracking/contracts

      - name: Sync Prisma Schema & Seed Database
        run: |
          npx prisma generate --schema=apps/backend/prisma/schema.prisma
          npx prisma db push --schema=apps/backend/prisma/schema.prisma
          node apps/backend/prisma/seed.js

      - name: Run Backend Health & Verification Test Suites
        run: |
          node apps/backend/verify-phase9-reports.js
          node apps/backend/verify-phase10-hardening.js

  docker-build-check:
    name: 3. Production Docker Multi-Stage Build Check
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: employee-tracking-backend:latest

      - name: Build Admin Next.js Standalone Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: employee-tracking-admin:latest
